spring.application.name=automanager
spring.datasource.url=${DB_URL:jdbc:h2:mem:autobots}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
autobots.jwt.segredo=${JWT_SECRET:}
autobots.jwt.duracao-segundos=${JWT_DURATION_SECONDS:3600}
autobots.admin.login=${ADMIN_LOGIN:}
autobots.admin.senha=${ADMIN_PASSWORD:}
